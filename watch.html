<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تفاصيل الفيلم</title>
  <style>
    body{
      margin:0;padding:0;
      background:#0f1724;color:#e6eef8;
      font-family:"Segoe UI",Tahoma,Arial;
    }
    header{
      display:flex;justify-content:space-between;align-items:center;
      padding:14px;border-bottom:1px solid rgba(255,255,255,0.1);
      background:rgba(0,0,0,0.3);backdrop-filter:blur(6px);
    }
    .logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#6B9EFF,#9ACDFF);display:flex;align-items:center;justify-content:center;font-weight:700;color:#071426}
    main{padding:20px;max-width:900px;margin:0 auto;}
    .poster{width:100%;max-width:300px;aspect-ratio:2/3;object-fit:cover;border-radius:10px}
    .details{display:flex;flex-direction:column;gap:12px;margin-top:20px}
    .title{font-size:24px;font-weight:700}
    .muted{color:#98a0b3}
    .badge{background:rgba(255,255,255,0.08);padding:4px 8px;border-radius:8px;font-size:13px;margin-inline-end:6px}
    .servers{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .server-btn{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,0.1);border:0;cursor:pointer;color:#fff;text-decoration:none}
    .actions{display:flex;gap:10px;margin-top:16px}
    .actions button{padding:10px 14px;border-radius:8px;border:0;cursor:pointer;font-weight:700}
    .fav{background:#ff6b6b;color:#fff}
    .save{background:#ffd56b;color:#071426}
    footer{text-align:center;padding:20px;color:#98a0b3}
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:10px">
      <img src="BN.jpg" class="logo"></img>
      <strong>BOOM NOUR<strong>
    </div>
    <a href="index.html" style="color:#000000;text-decoration:none" class="logo">right</a>
  </header>

  <main id="content">
    تحميل تفاصيل الفيلم...
  </main>

  <footer>صنع ياسين أعريش</footer>

  <script>
    const DATA_URL = './movies_data (3).json';
    const params = new URLSearchParams(window.location.search);
    const movieId = params.get('id');

    const LS_FAV = 'movie_app_favorites_v1';
    const LS_SAVE = 'movie_app_saved_v1';
    function loadLS(key){ try { return JSON.parse(localStorage.getItem(key)||'[]') } catch(e){ return [] } }
    function saveLS(key,val){ localStorage.setItem(key, JSON.stringify(val)); }
    function isFavorite(id){ return loadLS(LS_FAV).includes(id) }
    function isSaved(id){ return loadLS(LS_SAVE).includes(id) }

    async function loadMovie(){
      try{
        const res = await fetch(DATA_URL);
        const movies = await res.json();
        const movie = movies.find(m => m.movie_link === movieId);
        if(!movie){ document.getElementById('content').innerHTML = 'لم يتم العثور على الفيلم'; return; }

        renderMovie(movie);
      }catch(e){
        document.getElementById('content').innerHTML = 'خطأ في تحميل الفيلم';
      }
    }

    function renderMovie(m){
      const c = document.getElementById('content');
      c.innerHTML = `
        <img class="poster" src="${m.image_url}" alt="${m.title}">
        <div class="details">
          <div class="title">${m.title}</div>
          <div>${(m.categories||[]).map(c=>`<span class="badge">${c}</span>`).join('')}</div>
          <div>⭐ التقييم: <strong>${m.rating || 'N/A'}</strong></div>
          <div class="muted">المشاهدات: ${m.views||0}</div>
          <div class="muted">الجودة: ${m.quality||''}</div>
          <div class="servers">
            ${m.server_2 ? `<a class="server-btn" href="${m.server_2}" target="_blank">سيرفر المشاهدة</a>` : '<span class="muted">لا يوجد سيرفر</span>'}
          </div>
        </div>
      `;

      const actions = document.createElement('div');
      actions.className = 'actions';

      const fav = document.createElement('button');
      fav.className = 'fav';
      fav.textContent = isFavorite(m.movie_link) ? 'إزالة من المفضلة' : 'أضف للمفضلة';
      fav.onclick = ()=>{ 
        const cur = loadLS(LS_FAV);
        const idx = cur.indexOf(m.movie_link);
        if(idx===-1) cur.push(m.movie_link); else cur.splice(idx,1);
        saveLS(LS_FAV,cur);
        fav.textContent = isFavorite(m.movie_link) ? 'إزالة من المفضلة' : 'أضف للمفضلة';
      };

      const save = document.createElement('button');
      save.className = 'save';
      save.textContent = isSaved(m.movie_link) ? 'إزالة من المحفوظة' : 'حفظ للمشاهدة';
      save.onclick = ()=>{ 
        const cur = loadLS(LS_SAVE);
        const idx = cur.indexOf(m.movie_link);
        if(idx===-1) cur.push(m.movie_link); else cur.splice(idx,1);
        saveLS(LS_SAVE,cur);
        save.textContent = isSaved(m.movie_link) ? 'إزالة من المحفوظة' : 'حفظ للمشاهدة';
      };

      actions.appendChild(fav);
      actions.appendChild(save);
      c.appendChild(actions);
    }

    loadMovie();
  </script>
</body>
</html>
